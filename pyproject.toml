[project]
name = "venv-global"
version = "0.1.0"
description = "Shared Python tools for lightweight experiments and Quarto work"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bibtexparser>=2.1.0",
    "jinja2>=3.1.6",
    "jupyter>=1.1.1",
    "lxml>=6.1.3",
    "markdown>=3.11.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.4",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "tqdm>=4.70.1",
    "xlsxwriter>=3.3.4",
]

[tool.uv]
# This project manages a shared environment; it is not an installable package.
package = false
